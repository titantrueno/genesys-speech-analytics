              password: demo
        required: true
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Wrong credentials, non-existent or deactivated user (same response).
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorText'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Public. Returns the Bearer token (expires after 8 h) and the user with their permissions. Records the last
        sign-in. The email is case-insensitive.
