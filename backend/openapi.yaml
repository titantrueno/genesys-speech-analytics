            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'No valid session: the token is missing, tampered with or expired, or the user is deactivated.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '403':
          description: Missing permission `explorer:use`.
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '422':
          description: Invalid query (per condition) or out-of-range parameters. Out-of-range or wrongly typed parameters
            return the native FastAPI error.
          content:
            application/json:
              schema:
                oneOf:
                - &id002
                  $ref: '#/components/schemas/QueryErrors'
                - $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
      description: 'Permission: `explorer:use`. Runs a query (`Query`) and returns the total, the 13 KPIs of the result and
        a page of the list. Maximum 50 conditions, 2 group levels and 200 values per list.'
