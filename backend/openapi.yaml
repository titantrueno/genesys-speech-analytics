            example:
              from: '2026-08-28'
              to: '2026-09-26'
              root:
                op: and
                conditions:
                - field: channel
                  operator: is
                  value: chat
                - field: sentiment
                  operator: lt
                  value: -0.3
                - op: or
                  conditions:
                  - field: check:saludo
                    operator: fails
                  - field: transcript
                    operator: contains
                    value: PIN
                    speaker: agente
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'Sin sesión válida: falta el token, está manipulado o caducado, o el usuario está desactivado.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '403':
