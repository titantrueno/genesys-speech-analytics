            - voz
            - chat
            type: string
          - type: 'null'
          title: Channel
      - name: queue
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Queue
      - name: agent
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Agent
      - name: main_topic
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Main Topic
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'Sin sesión válida: falta el token, está manipulado o caducado, o el usuario está desactivado.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '403':
          description: Falta el permiso `dashboards:view`.
          content:
            application/json:
