            shows “No data · analysis pending”.'
          title: Pending
          type: boolean
        based_on:
          anyOf:
          - type: integer
          - type: 'null'
          description: Conversations the value is computed on, for KPIs that can use only a part (AHT, sentiment, first response);
            `null` for the rest.
          title: Based On
      required:
      - code
      - label
      - unit
      - higher_is_better
      - value
      - previous
      - delta
      - delta_pct
      - target
      - status
      - pending
      - based_on
      title: SummaryKpi
      type: object
    TableResult:
      additionalProperties: false
      properties:
        rows:
          items:
            $ref: '#/components/schemas/TableRow'
          title: Rows
          type: array
      required:
      - rows
      title: TableResult
      type: object
    TableRow:
      additionalProperties: false
      properties:
        conversation:
          $ref: '#/components/schemas/ConversationItem'
        result:
          description: Text, label or JSON object depending on the prompt format.
          title: Result
      required:
      - conversation
      - result
      title: TableRow
      type: object
    TargetField:
      additionalProperties: false
      properties:
        value:
          title: Value
          type: string
        label:
          title: Label
          type: string
        group:
          description: Dropdown group (FE014).
          enum:
          - analisis
          - cumplimiento
          - entidades
          title: Group
          type: string
      required:
      - value
      - label
      - group
      title: TargetField
      type: object
    Taxonomy:
      additionalProperties: false
      properties:
        main_topics:
          items:
            $ref: '#/components/schemas/TaxonomyTopic'
          title: Main Topics
          type: array
        secondary_topics:
          items:
            $ref: '#/components/schemas/TaxonomyTopic'
          title: Secondary Topics
          type: array
      required:
      - main_topics
      - secondary_topics
      title: Taxonomy
      type: object
    TaxonomyTopic:
      additionalProperties: false
      properties:
        id:
          description: Identifier `1TP-…` (main topic) or `1TS-…` (secondary topic).
          title: Id
          type: string
        code:
          title: Code
          type: string
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        keywords:
          items:
            type: string
          title: Keywords
          type: array
        active:
          title: Active
          type: boolean
        conversations:
          title: Conversations
          type: integer
      required:
      - id
      - code
      - name
      - description
      - keywords
      - active
      - conversations
      title: TaxonomyTopic
      type: object
    TimePoint:
      additionalProperties: false
      properties:
        period_start:
          format: date
          title: Period Start
          type: string
        period_end:
          format: date
          title: Period End
          type: string
        value:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          title: Value
      required:
      - period_start
      - period_end
      - value
      title: TimePoint
      type: object
    Timeseries:
      additionalProperties: false
      properties:
        kpi:
          enum:
          - volume
          - aht_s
          - sentiment_avg
          - negative_pct
          - resolution_rate
          - escalation_rate
          - fcr_rate
          - csat_avg
          - effort_avg
          - compliance_rate
          - churn_high_pct
          - first_response_s
          - avg_turns
          title: Kpi
          type: string
        granularity:
          enum:
          - day
          - week
          title: Granularity
          type: string
        period:
          $ref: '#/components/schemas/Period'
        pending:
          description: '`true` if the KPI depends on the analysis and is still pending (`null` points).'
          title: Pending
          type: boolean
        points:
          items:
            $ref: '#/components/schemas/TimePoint'
          title: Points
          type: array
      required:
      - kpi
      - granularity
      - period
      - pending
      - points
      title: Timeseries
      type: object
    Turn:
      properties:
        speaker:
          enum:
          - cliente
          - agente
          - bot
          - sistema
          title: Speaker
          type: string
        text:
          title: Text
          type: string
        offset_s:
          title: Offset S
          type: integer
        sentiment:
          anyOf:
          - type: number
          - type: 'null'
          title: Sentiment
        delivered:
          default: true
          title: Delivered
          type: boolean
      required:
      - speaker
      - text
      - offset_s
      - sentiment
      title: Turn
      type: object
    UserIn:
      additionalProperties: false
      properties:
        name:
          maxLength: 80
          minLength: 1
          title: Name
          type: string
        email:
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          type: string
        role:
          title: Role
          type: string
        active:
          default: true
          title: Active
          type: boolean
      required:
      - name
      - email
      - role
      title: UserIn
      type: object
    Validation:
      additionalProperties: false
      properties:
        valid:
          title: Valid
          type: boolean
        issues:
          items:
            $ref: '#/components/schemas/FlowIssue'
          title: Issues
          type: array
      required:
      - valid
      - issues
      title: Validation
      type: object
    ValueLabel:
      additionalProperties: false
      properties:
        value:
          title: Value
          type: string
        label:
          title: Label
          type: string
      required:
      - value
      - label
      title: ValueLabel
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token from `POST /api/auth/login`. Expires after 8 h (`AUTH_TOKEN_TTL_SECONDS`).
  headers:
    XAuthVersion:
      description: Users and roles version; if it changes, `/api/auth/me` must be requested again (FE006).
      schema:
        type: integer
        minimum: 0
tags:
- name: health
  description: Health probe.
- name: auth
  description: Sign-in and current user.
- name: metrics
  description: Dashboard KPIs (FE001, FE005).
- name: conversations
  description: List, detail and filter catalog (FE001).
- name: query
  description: Assisted query explorer and saved queries (FE002).
- name: search
  description: Semantic search and similar conversations (FE003).
- name: flows
  description: Insight flows and their simulated runs (FE004).
- name: config
  description: Global platform settings (FE005).
- name: downloads
  description: Genesys Cloud conversation download flows (FE011).
- name: users
  description: Users, roles and permission matrix (FE006).
security:
- bearerAuth: []
