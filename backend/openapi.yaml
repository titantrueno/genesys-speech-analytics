          type: array
        compliance_by_check:
          items:
            $ref: '#/components/schemas/CheckRate'
          title: Compliance By Check
          type: array
      required:
      - period
      - previous_period
      - kpis
      - compliance_by_check
      title: Summary
      type: object
    SummaryKpi:
      additionalProperties: false
      properties:
        code:
          enum:
          - volume
          - aht_s
          - sentiment_avg
          - negative_pct
          - resolution_rate
          - escalation_rate
          - fcr_rate
          - csat_avg
          - effort_avg
          - compliance_rate
          - churn_high_pct
          - first_response_s
          - avg_turns
          title: Code
          type: string
        label:
          title: Label
          type: string
        unit:
          enum:
          - conversaciones
          - s
          - índice
          - '%'
          - 1-5
          - turnos
          title: Unit
          type: string
        higher_is_better:
          title: Higher Is Better
          type: boolean
        value:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          description: '`null` si no hay conversaciones aplicables.'
          title: Value
        previous:
          anyOf:
          - type: number
          - type: integer
          - type: 'null'
          title: Previous
        delta:
          anyOf:
          - type: number
          - type: 'null'
          title: Delta
        delta_pct:
          anyOf:
          - type: number
          - type: 'null'
          description: '`null` si el anterior es 0 o nulo, o si la unidad es `índice`.'
          title: Delta Pct
        target:
          anyOf:
          - type: number
          - type: 'null'
          title: Target
        status:
          anyOf:
          - enum:
            - verde
            - ambar
            - rojo
            type: string
          - type: 'null'
          description: Según los umbrales; `null` sin umbrales.
          title: Status
        pending:
          description: '`true` si depende del análisis de la plataforma y las conversaciones reales aún no lo tienen: la UI
