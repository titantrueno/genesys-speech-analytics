                conditions:
                - field: channel
                  operator: is
                  value: chat
                - field: sentiment
                  operator: lt
                  value: -0.3
                - op: or
                  conditions:
                  - field: check:saludo
                    operator: fails
                  - field: transcript
                    operator: contains
                    value: PIN
                    speaker: agente
