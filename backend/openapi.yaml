              schema:
                $ref: '#/components/schemas/UserOut'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'Sin sesión válida: falta el token, está manipulado o caducado, o el usuario está desactivado.'
