  - value: users:admin
    label: Administrar usuarios y roles
paths:
  /api/health:
    get:
      summary: Sonda de salud
      operationId: health_api_health_get
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      description: Público. Responde cuando la API ha terminado de arrancar (índice de búsqueda construido).
      security: []
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Iniciar sesión
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: analista@bancohorizonte.demo
              password: demo
        required: true
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales incorrectas, usuario inexistente o desactivado (misma respuesta).
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorText'
        '422':
          description: Parámetros no válidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Público. Devuelve el token Bearer (caduca a las 8 h) y el usuario con sus permisos. Anota el último acceso.
        El email no distingue mayúsculas.
      security: []
