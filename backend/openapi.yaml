          title: Pending
          type: boolean
        based_on:
          anyOf:
          - type: integer
          - type: 'null'
          description: Conversaciones sobre las que se calcula, en los KPIs que pueden usar solo una parte (AHT, sentimiento,
            primera respuesta); `null` en el resto.
          title: Based On
      required:
      - code
      - label
      - unit
      - higher_is_better
      - value
      - previous
      - delta
      - delta_pct
      - target
      - status
      - pending
      - based_on
      title: SummaryKpi
      type: object
