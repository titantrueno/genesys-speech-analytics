          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '422':
          description: Consulta no válida (por condición) o parámetros fuera de rango. Los parámetros fuera de rango o de
            tipo devuelven el error nativo de FastAPI.
          content:
            application/json:
              schema:
                oneOf:
                - &id002
                  $ref: '#/components/schemas/QueryErrors'
