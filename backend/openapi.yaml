              $ref: '#/components/headers/XAuthVersion'
      description: 'Permission: `users:admin`.'
  /api/roles/{role_id}:
    put:
      tags:
      - users
      summary: Change the name and permissions of a role
      operationId: update_role_api_roles__role_id__put
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          title: Role Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleIn'
      responses:
        '200':
          description: Correcto.
          content:
            application/json:
              schema: *id022
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'No valid session: the token is missing, tampered with or expired, or the user is deactivated.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '403':
          description: Missing permission `users:admin`.
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '404':
          description: It does not exist (or the identifier is of another type).
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '409':
          description: 'Administration protection: removing `users:admin` from oneself, leaving no active `admin`, or removing
            `users:admin` from the `admin` role.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '422':
          description: Per-field errors. Out-of-range or wrongly typed parameters return the native FastAPI error.
          content:
            application/json:
              schema:
                oneOf:
                - *id010
                - $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
      description: 'Permission: `users:admin`. Full list of permissions. Built-in roles cannot be renamed.'
    delete:
      tags:
      - users
      summary: Delete a custom role
      operationId: delete_role_api_roles__role_id__delete
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string
          title: Role Id
      responses:
        '204':
          description: Done, no body.
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '401':
          description: 'No valid session: the token is missing, tampered with or expired, or the user is deactivated.'
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '403':
          description: Missing permission `users:admin`.
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '404':
          description: It does not exist (or the identifier is of another type).
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '409':
          description: Built-in role or with assigned users.
          content:
            application/json:
              schema: *id001
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
        '422':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Auth-Version:
              $ref: '#/components/headers/XAuthVersion'
      description: 'Permission: `users:admin`.'
