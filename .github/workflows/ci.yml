name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/audit_vault.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/pytest -q
      - name: Tests con otro dataset (FE009)
        run: .venv/bin/pytest -q
        env:
          DATA_SEED: "7"
          DATA_REFERENCE_DATE: "2026-11-10"
      - name: OpenAPI al día y válido
        run: |
          .venv/bin/python ../scripts/export_openapi.py --check
          .venv/bin/pip install openapi-spec-validator && .venv/bin/openapi-spec-validator openapi.yaml
      - run: .venv/bin/pip install pip-audit && .venv/bin/pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
