name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/audit_vault.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # PostgreSQL efímero para los tests `pg` del servicio de ingesta (FE011).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: speech
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: speech_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speech -d speech_analytics_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: .venv/bin/pytest -q -m "not pg"
      - name: Tests con otro dataset (FE009)
        run: .venv/bin/pytest -q -m "not pg"
        env:
          DATA_SEED: "7"
          DATA_REFERENCE_DATE: "2026-11-10"
      - name: Tests con PostgreSQL (FE011)
        run: .venv/bin/pytest -q -m pg
        env:
          TEST_DATABASE_URL: postgresql://speech:ci-only@localhost:5432/speech_analytics_test
          REQUIRE_PG: "1"
      - name: OpenAPI al día y válido
        run: |
          .venv/bin/python ../scripts/export_openapi.py --check
          .venv/bin/pip install openapi-spec-validator && .venv/bin/openapi-spec-validator openapi.yaml
      - run: .venv/bin/pip install pip-audit && .venv/bin/pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
